<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cisco-Lab WebUI — VLANs</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="mono">CISCO-LAB</h1>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="vlan-list.html" class="active">VLANs</a>
        <a href="#" onclick="event.preventDefault(); logout();">Sign out</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2>VLANs</h2>
        <a href="vlan-add.html" class="btn primary" role="button">+ Add VLAN</a>
      </header>

      <div id="alertSlot"></div>

      <section id="vlanContainer">
        <div class="loading-wrap" style="text-align:center;padding:24px;color:#888">
          <span class="loading"></span> Loading VLANs…
        </div>
      </section>
    </main>
  </div>

  <script>
    requireLogin();

    // Tiny helpers — building elements with createElement + textContent is
    // the safe pattern for any value that came from user input (URL params,
    // form fields, localStorage). innerHTML executes <script> tags inside
    // interpolated strings; textContent never does.
    function el(tag, opts = {}) {
      const node = document.createElement(tag);
      if (opts.className) node.className = opts.className;
      if (opts.text != null) node.textContent = String(opts.text);
      if (opts.style) Object.assign(node.style, opts.style);
      if (opts.role) node.setAttribute("role", opts.role);
      return node;
    }

    // Surface success message from the redirect after add.
    // The ?added= value is user-controlled (the VLAN ID they typed) — render
    // it via textContent, never via innerHTML interpolation.
    const params = new URLSearchParams(window.location.search);
    const addedVlanId = params.get("added");
    if (addedVlanId) {
      const alert = el("div", { className: "alert success", role: "status" });
      alert.textContent = `VLAN ${addedVlanId} was created successfully.`;
      document.getElementById("alertSlot").appendChild(alert);
    }

    // Simulate a small load delay so Playwright has a networkidle to wait for
    (async () => {
      await fakeDelay(500);
      const vlans = getVlans();
      const container = document.getElementById("vlanContainer");

      // Clear the "Loading VLANs…" placeholder.
      container.textContent = "";

      if (vlans.length === 0) {
        container.appendChild(
          el("div", {
            className: "empty",
            text: 'No VLANs configured yet. Click "+ Add VLAN" to create one.',
          })
        );
        return;
      }

      const table = el("table", { role: "table" });
      const thead = el("thead");
      const headerRow = el("tr");
      for (const label of ["VLAN ID", "Name", "Interface", "Mode", "Created"]) {
        headerRow.appendChild(el("th", { text: label }));
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = el("tbody");
      for (const v of vlans) {
        const tr = el("tr");
        // Each cell uses textContent — VLAN name comes from user input, so we
        // MUST NOT pass it through any innerHTML / template-string path.
        tr.appendChild(el("td", { className: "mono", text: v.id }));
        tr.appendChild(el("td", { text: v.name }));
        tr.appendChild(el("td", { className: "mono", text: v.interface }));
        tr.appendChild(el("td", { text: v.mode }));
        tr.appendChild(
          el("td", {
            className: "mono",
            style: { color: "#888" },
            text: new Date(v.createdAt).toLocaleString(),
          })
        );
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      container.appendChild(table);
    })();
  </script>
</body>
</html>
