[project]
name = "cisco-ai-config-agent"
version = "0.0.1"
description = "AI-assisted configuration agent for Cisco C1111"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default args (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow:        slow tests; deselect with -m 'not slow'",
    "integration: tests that talk to a real router or external service",
    "webui:       tests that launch a real Chromium browser via Playwright",
    "smoke:       end-to-end scenarios for the 6 PROJECT_PLAN.md §2 cases",
]
