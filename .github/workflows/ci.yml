name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      # mypy is *gated* — it must pass for the PR to merge. The set of
      # known-bad files is configured in pyproject.toml under
      # [[tool.mypy.overrides]] ignore_errors=true. New code in any
      # other file is type-checked. Fix-then-remove-from-overrides is
      # the migration path. Audit #22 follow-up.
      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend (Node.js 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Explicit type check separate from build — fails faster on type
      # errors and gates merges without needing to wait for the full
      # Next.js build. Review §2 HIGH follow-up.
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (Next.js)
        run: npm run build
