name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      # mypy is *gated* — it must pass for the PR to merge. The set of
      # known-bad files is configured in pyproject.toml under
      # [[tool.mypy.overrides]] ignore_errors=true. New code in any
      # other file is type-checked. Fix-then-remove-from-overrides is
      # the migration path. Audit #22 follow-up.
      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q

  # NOTE: the frontend job was removed at v0.5.0-new-frontend. The new
  # frontend (frontend/*.jsx + index.html) runs from CDN React + Babel
  # in-browser — no npm, no bundler, no TypeScript build step. Backend
  # tests already exercise the StaticFiles mount path on import, so a
  # missing frontend/ directory would fail there. If a future Phase 2
  # port to Next.js lands, restore the npm setup-node block here.
