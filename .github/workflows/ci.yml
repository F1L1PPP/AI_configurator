name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      # mypy is run in permissive mode for now — the codebase has heavy
      # type hints but they've never been gated by CI, so we accept warnings
      # as we tighten. Audit #22.
      - name: Type check (mypy)
        run: mypy backend/ --ignore-missing-imports --no-strict-optional --allow-untyped-defs --no-error-summary || true

      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend (Node.js 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (also runs TypeScript type-check)
        run: npm run build
